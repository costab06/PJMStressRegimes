# Exploratory anomaly feature specification, version 1
# Registered 2026-11-14 AFTER examination of the 11 event episodes.
# Not a modification of research_spec.yaml's frozen-v1 primary analysis.
version: anomaly-exploratory-v1
status: exploratory_post_hoc
hypothesis: >
  Unusual joint states and transitions may precede operational escalation
  even when individual stress magnitudes are unremarkable.
source_variables: [load_z, fe_z, ramp3_z, ic_z]
source_baseline: data/processed/baseline_2021_frozen_v1.parquet
feature_families:
  state: [load_z, fe_z, ramp3_z, ic_z]
  dynamics:
    first_difference_lags_hours: [1, 3, 6]
    second_difference_hours: 1
    rolling_standard_deviation_hours: [6, 12, 24]
  persistence:
    joint_l2_threshold: 4.0
    rolling_counts_hours: [6, 12, 24]
    rolling_joint_mean_hours: [6, 12, 24]
  relationships:
    rolling_pearson_pairs: all_six_pairs
    windows_hours: [12, 24]
    lagged_pearson:
      windows_hours: [24]
      predictor_lag_hours: 1
      pairs: [[load_z, ic_z], [fe_z, ic_z], [ramp3_z, ic_z]]
      definition: correlation(x[t-window-lag+1:t-lag], y[t-window+1:t])
window_policy:
  timestamps: UTC
  windows: trailing_inclusive
  missing: strict_full_window_required
  gaps: reset_all_history_on_nonconsecutive_hour
  hour_label: start_of_hour
  point_in_time: >
    The value at timestamp t may be used only after the interval [t,t+1h)
    is complete and after the underlying data publication latency.
training_policy:
  initial: no_model_training_in_this_step
  warning: >
    The 2021 baseline is derived from 2021; using its normalized 2021
    observations for an independent anomaly evaluation is in-sample.
    Construct a chronologically separate reference and evaluation split.
evaluation_policy:
  episode_unit: independent_episode
  labels: never_used_for_feature_fitting
  avoid: selecting_features_or_thresholds_based_on_11_episode_outcomes
  compare_against: frozen_four_feature_baseline
planned_extensions: [neighbor_balancing_authorities, weather, transmission_topology]
