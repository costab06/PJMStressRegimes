study:
  name: grid-regime-study
  description: >
    Detect and characterize electricity grid stress regimes using hourly
    operational data. Primary focus on Elliott Event (Dec 2022) versus
    matched control periods, with retrospective analysis of 2003 blackout
    and 2014 polar vortex.

  time_range:
    start: "2016-01-01"
    end: "2026-12-31"

  # Events are defined in metadata/events.csv.
  # model_role=positive rows supply T_i (operator_action_time) for lead-time scoring.
  # model_role=hard_negative rows are genuine stress periods with no operator action;
  # they anchor false-positive control and must not be treated as easy negatives.
  #
  # first_alert_time is recorded for reference only — it is NOT used as T_i because
  # PJM alerts can be issued >24 h ahead based on forecasts, which would cause the
  # model to replicate PJM's forecast rather than detect impending operational stress.
  event_catalog: metadata/events.csv

  historical_events:
    - name: 2003_blackout
      period: ["2003-08-14 00:00", "2003-08-16 23:00"]
    - name: 2014_polar_vortex
      period: ["2014-01-06 00:00", "2014-01-08 23:00"]

  balance_authorities:
    primary: [PJM, MISO, TVA, SOCO, DUK, CPLE, CPLW, FPC, FPL, GVL, HST, JEA, NSB, SEC, TEC, TAL, FGE]
    neighbors: [NYIS, ISNE, LGEE, EKPC]

  window_hours:
    pre_event: 72
    post_event: 72

  lead_times_hours: [6, 12, 24, 48, 72]
