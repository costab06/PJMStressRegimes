name: OAF adapter validation

on:
  push:
    branches: [feature/oaf-migration-phase1]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PJMStressRegimes
        uses: actions/checkout@v4
      - name: Checkout OpenAgentFabric
        uses: actions/checkout@v4
        with:
          repository: costab06/OpenAgentFabric
          path: OpenAgentFabric
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -e ./OpenAgentFabric
          python -m pip install pytest-asyncio
      - name: Run provenance and adapter tests
        run: python -m pytest -q tests/test_provenance.py tests/test_oaf_eia930.py
      - name: Run existing PJM tests
        run: python -m pytest -q tests
