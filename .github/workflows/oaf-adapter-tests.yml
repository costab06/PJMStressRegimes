name: OAF adapter validation

on:
  push:
    branches: [main, feature/oaf-migration-phase1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OAF_TEST_REDIS_URL: redis://localhost:6379/14
    steps:
      - name: Checkout PJMStressRegimes
        uses: actions/checkout@v4
      - name: Checkout OpenAgentFabric
        uses: actions/checkout@v4
        with:
          repository: costab06/OpenAgentFabric
          path: OpenAgentFabric
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -e ./OpenAgentFabric
          python -m pip install pytest-asyncio
      - name: Run provenance and adapter tests
        run: python -m pytest -q tests/test_provenance.py tests/test_oaf_eia930.py tests/test_oaf_eia930_redis.py tests/test_oaf_historical_comparison.py tests/test_oaf_feature_agent.py tests/test_oaf_acquisition_coordinator.py tests/test_oaf_cycle_scheduler.py tests/test_oaf_pjm_procedures.py tests/test_oaf_acquisition_status.py tests/test_oaf_pjm_live.py
      - name: Run existing PJM tests
        run: python -m pytest -q tests
