name: Architecture demonstration

on:
  push:
    branches: [demo/architecture-case-study]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: costab06/OpenAgentFabric
          ref: 1cb2680cfc78df271726dc17be3434e120012f6c
          path: OpenAgentFabric
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e ./OpenAgentFabric
          python -m pytest -q tests
